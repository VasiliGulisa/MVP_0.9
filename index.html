<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0d10" id="theme-meta">
<title>Wallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  /* === DARK THEME (default) === */
  :root, [data-theme="dark"] {
    --bg: #0d0d10;
    --surface: #15151a;
    --surface-2: #1c1c22;
    --surface-3: #25252d;
    --border: #25252d;
    --border-strong: #353541;
    --divider: #1c1c22;

    --text: #f4f3ee;
    --text-2: #a8a89a;
    --text-3: #6b6b65;
    --text-4: #3d3d40;

    --accent: #FF6A4C;
    --accent-2: #FF9B82;
    --accent-soft: rgba(255, 106, 76, 0.12);
    --accent-soft-strong: rgba(255, 106, 76, 0.22);

    --positive: #6BC495;
    --negative: #E15554;

    --card-grad-1: linear-gradient(155deg, #2a1a18 0%, #1c1c22 60%);
    --card-grad-2: linear-gradient(155deg, #1a2622 0%, #1c1c22 60%);
    --card-grad-3: linear-gradient(155deg, #2a2418 0%, #1c1c22 60%);
    --card-grad-4: linear-gradient(155deg, #1a1c2e 0%, #1c1c22 60%);

    --shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 24px rgba(0,0,0,0.3);
    --hairline: 0 0 0 0.5px rgba(255,255,255,0.06);
  }
  /* === LIGHT THEME === */
  [data-theme="light"] {
    --bg: #f5f1ea;
    --surface: #ffffff;
    --surface-2: #ffffff;
    --surface-3: #ede8e0;
    --border: #e7e2d7;
    --border-strong: #d6d0c2;
    --divider: #f0ebe1;

    --text: #1a1815;
    --text-2: #5a574e;
    --text-3: #8a8678;
    --text-4: #c2bdb0;

    --accent: #E5503A;
    --accent-2: #FF7050;
    --accent-soft: rgba(229, 80, 58, 0.08);
    --accent-soft-strong: rgba(229, 80, 58, 0.18);

    --positive: #3a8a5e;
    --negative: #c44848;

    --card-grad-1: linear-gradient(155deg, #fce4d8 0%, #f5f1ea 70%);
    --card-grad-2: linear-gradient(155deg, #d8eedf 0%, #f5f1ea 70%);
    --card-grad-3: linear-gradient(155deg, #f5e8c9 0%, #f5f1ea 70%);
    --card-grad-4: linear-gradient(155deg, #dde0f0 0%, #f5f1ea 70%);

    --shadow: 0 1px 2px rgba(0,0,0,0.03), 0 8px 24px rgba(120,100,80,0.06);
    --hairline: 0 0 0 0.5px rgba(0,0,0,0.04);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    height: 100dvh;
    overscroll-behavior: none;
  }
  body {
    font-family: 'Geist', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    font-feature-settings: "ss01", "cv11";
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-variant-numeric: tabular-nums;
  }
  #root {
    height: 100vh;
    height: 100dvh;
    width: 100vw;
    display: flex;
  }
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    background: none;
    color: inherit;
    font-feature-settings: inherit;
  }
  input { font-family: inherit; outline: none; }

  .phone {
    width: 100%;
    height: 100%;
    max-width: 480px;
    margin: 0 auto;
    background: var(--bg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    transition: background 0.4s ease, color 0.4s ease;
  }

  .screen {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    -webkit-overflow-scrolling: touch;
    animation: pageIn 0.32s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes pageIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .screen::-webkit-scrollbar { width: 0; height: 0; }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: calc(16px + env(safe-area-inset-top)) 22px 16px;
    flex-shrink: 0;
  }
  .topbar-title {
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }

  .icon-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    color: var(--text);
    transition: background 0.15s;
  }
  .icon-btn:active { background: var(--surface-3); }
  .icon-btn-ghost {
    background: transparent;
  }

  .back-btn {
    display: flex; align-items: center; justify-content: center;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--surface);
    color: var(--text);
    flex-shrink: 0;
  }

  /* ==== Welcome ==== */
  .welcome {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 24px) 28px calc(env(safe-area-inset-bottom) + 32px);
    position: relative;
    overflow: hidden;
  }
  .welcome-bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .welcome-bg::before {
    content: '';
    position: absolute;
    top: -10%;
    right: -30%;
    width: 80%;
    height: 70%;
    background: radial-gradient(circle, var(--accent-soft) 0%, transparent 60%);
    filter: blur(40px);
  }
  .welcome-bg::after {
    content: '';
    position: absolute;
    bottom: 10%;
    left: -30%;
    width: 70%;
    height: 50%;
    background: radial-gradient(circle, var(--accent-soft) 0%, transparent 60%);
    filter: blur(50px);
    opacity: 0.5;
  }
  .welcome-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    z-index: 1;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .brand-mark {
    width: 32px; height: 32px;
    background: var(--text);
    color: var(--bg);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Instrument Serif', serif;
    font-size: 22px;
    font-style: italic;
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1;
    padding-top: 2px;
  }
  .display-h1 {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: 56px;
    line-height: 1;
    letter-spacing: -0.025em;
    margin-bottom: 24px;
  }
  .display-h1 em {
    font-style: italic;
    color: var(--accent);
  }
  .display-sub {
    font-size: 16px;
    color: var(--text-2);
    line-height: 1.45;
    max-width: 320px;
    letter-spacing: -0.01em;
  }
  .feat-list {
    display: flex; flex-direction: column;
    gap: 16px;
    margin-top: 32px;
  }
  .feat-row {
    display: flex; align-items: center; gap: 14px;
    font-size: 14px;
    color: var(--text-2);
  }
  .feat-num {
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    color: var(--text-3);
    letter-spacing: 0;
    width: 24px;
    flex-shrink: 0;
  }
  .feat-line {
    flex: 1;
    height: 0.5px;
    background: var(--border);
    margin-right: 12px;
  }
  .welcome-actions {
    display: flex; flex-direction: column; gap: 10px;
    margin-top: 40px;
  }

  /* ==== Buttons ==== */
  .btn-primary {
    background: var(--text);
    color: var(--bg);
    font-weight: 500;
    font-size: 15px;
    padding: 18px 24px;
    border-radius: 999px;
    width: 100%;
    letter-spacing: -0.01em;
    transition: transform 0.15s, opacity 0.15s;
  }
  .btn-primary:active { transform: scale(0.985); }
  .btn-primary:disabled { opacity: 0.4; }

  .btn-accent {
    background: var(--accent);
    color: #fff;
    font-weight: 500;
    font-size: 15px;
    padding: 18px 24px;
    border-radius: 999px;
    width: 100%;
    letter-spacing: -0.01em;
    transition: transform 0.15s, opacity 0.15s;
  }
  .btn-accent:active { transform: scale(0.985); }
  .btn-accent:disabled { opacity: 0.4; }

  .btn-ghost {
    background: transparent;
    color: var(--text);
    border: 0.5px solid var(--border-strong);
    font-weight: 500;
    font-size: 14px;
    padding: 16px 22px;
    border-radius: 999px;
    width: 100%;
  }
  .btn-link {
    color: var(--text-2);
    font-size: 14px;
    padding: 12px;
    text-align: center;
    width: 100%;
    font-weight: 400;
  }

  /* ==== Home ==== */
  .home-greeting {
    display: flex; flex-direction: column;
    gap: 2px;
  }
  .home-greeting-l1 {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 22px;
    color: var(--text-2);
    letter-spacing: -0.01em;
    line-height: 1;
  }
  .home-greeting-l2 {
    font-size: 13px;
    color: var(--text-3);
    letter-spacing: -0.005em;
  }

  .balance-block {
    padding: 12px 22px 8px;
  }
  .balance-label {
    font-size: 12px;
    color: var(--text-3);
    margin-bottom: 6px;
    letter-spacing: -0.005em;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .balance-amount {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: 64px;
    line-height: 0.95;
    letter-spacing: -0.035em;
    color: var(--text);
    display: flex;
    align-items: baseline;
    gap: 4px;
  }
  .balance-cents {
    font-size: 28px;
    color: var(--text-3);
    letter-spacing: -0.02em;
  }
  .balance-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    font-size: 12px;
  }
  .balance-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px 4px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 500;
    font-size: 11px;
    letter-spacing: -0.005em;
  }

  /* ==== Cards swipe ==== */
  .accs-section {
    padding: 8px 0 4px;
  }
  .accs-track {
    display: flex;
    gap: 10px;
    padding: 0 22px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
  }
  .accs-track::-webkit-scrollbar { display: none; }

  .acc-card {
    width: calc(100vw - 88px);
    max-width: 392px;
    flex-shrink: 0;
    scroll-snap-align: start;
    border-radius: 24px;
    padding: 22px 22px 20px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    box-shadow: var(--shadow);
    border: 0.5px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .acc-card[data-grad="1"] { background: var(--card-grad-1); }
  .acc-card[data-grad="2"] { background: var(--card-grad-2); }
  .acc-card[data-grad="3"] { background: var(--card-grad-3); }
  .acc-card[data-grad="4"] { background: var(--card-grad-4); }

  .acc-head {
    display: flex; justify-content: space-between; align-items: center;
  }
  .acc-tag {
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--text-3);
    text-transform: uppercase;
  }
  .acc-flag {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 18px;
    line-height: 1;
    background: var(--surface-3);
    color: var(--text);
  }
  .acc-bal {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: 38px;
    letter-spacing: -0.025em;
    line-height: 1;
    color: var(--text);
  }
  .acc-bal-cents {
    font-size: 18px;
    color: var(--text-3);
  }
  .acc-foot {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px;
    color: var(--text-3);
    margin-top: auto;
  }
  .add-acc {
    width: 80px;
    flex-shrink: 0;
    border-radius: 24px;
    border: 0.5px dashed var(--border-strong);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--text-3);
    font-size: 11px;
    gap: 6px;
    background: transparent;
  }

  /* ==== Quick actions ==== */
  .quick-actions {
    padding: 18px 22px 12px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .qa {
    display: flex; flex-direction: column; align-items: center;
    gap: 8px;
    padding: 14px 4px 12px;
    border-radius: 16px;
    background: var(--surface);
    border: 0.5px solid var(--border);
    transition: background 0.15s;
  }
  .qa:active { background: var(--surface-3); }
  .qa-icon {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text);
  }
  .qa-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-2);
    letter-spacing: -0.005em;
  }

  /* ==== Section ==== */
  .section-head {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 18px 22px 10px;
  }
  .section-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-2);
    letter-spacing: -0.005em;
  }
  .section-link {
    font-size: 12px;
    color: var(--text-3);
    transition: color 0.15s;
  }
  .section-link:active { color: var(--text); }

  /* ==== Tx list ==== */
  .tx-list {
    padding: 0 12px 80px;
  }
  .tx-item {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 10px;
    border-radius: 14px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .tx-item:active { background: var(--surface); }

  .tx-icon {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    color: var(--text);
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 18px;
    line-height: 1;
  }
  .tx-info { flex: 1; min-width: 0; }
  .tx-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.005em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tx-date {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 1px;
    letter-spacing: -0.005em;
  }
  .tx-amount {
    font-size: 14px;
    font-weight: 500;
    flex-shrink: 0;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .tx-amount.in { color: var(--positive); }
  .tx-amount.out { color: var(--text); }

  /* ==== Spark ==== */
  .spark-card {
    margin: 14px 22px 4px;
    padding: 18px 18px 12px;
    background: var(--surface);
    border-radius: 18px;
    border: 0.5px solid var(--border);
  }
  .spark-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 8px;
  }
  .spark-label {
    font-size: 12px;
    color: var(--text-3);
  }
  .spark-val {
    font-family: 'Instrument Serif', serif;
    font-size: 22px;
    color: var(--text);
    letter-spacing: -0.02em;
    line-height: 1;
    margin-top: 4px;
  }
  .spark-delta {
    font-size: 11px;
    color: var(--positive);
    margin-top: 4px;
    letter-spacing: -0.005em;
  }
  .spark-period-tabs {
    display: flex;
    gap: 14px;
    font-size: 11px;
    color: var(--text-3);
    margin-top: 10px;
    padding-top: 10px;
    border-top: 0.5px solid var(--border);
  }
  .spark-period-tab.active {
    color: var(--accent);
    font-weight: 500;
  }

  /* ==== Bottom nav ==== */
  .bottomnav {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-top: 0.5px solid var(--border);
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    background: var(--bg);
    flex-shrink: 0;
    backdrop-filter: blur(20px);
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center;
    gap: 5px;
    padding: 8px;
    border-radius: 14px;
    transition: background 0.15s;
  }
  .nav-label {
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: -0.005em;
  }
  .nav-item.active .nav-label {
    color: var(--accent);
    font-weight: 500;
  }

  /* ==== Form ==== */
  .form-stack { padding: 0 22px; display: flex; flex-direction: column; gap: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-label {
    font-size: 11px;
    color: var(--text-3);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-left: 14px;
  }
  .form-input {
    width: 100%;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    color: var(--text);
    font-size: 15px;
    letter-spacing: -0.005em;
    transition: border-color 0.15s, background 0.15s;
  }
  .form-input:focus {
    border-color: var(--accent);
    background: var(--surface);
  }
  .form-input::placeholder { color: var(--text-3); }

  /* ==== Bottom actions ==== */
  .bottom-actions {
    padding: 14px 22px calc(20px + env(safe-area-inset-bottom));
    background: linear-gradient(to bottom, transparent, var(--bg) 30%);
    flex-shrink: 0;
  }

  /* ==== Big amount input ==== */
  .amount-stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 22px;
  }
  .amount-from {
    font-size: 12px;
    color: var(--text-3);
    margin-bottom: 14px;
    letter-spacing: -0.005em;
  }
  .amount-input-row {
    display: flex; align-items: baseline; gap: 8px;
  }
  .amount-input {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: 88px;
    background: transparent;
    border: none;
    color: var(--text);
    text-align: center;
    width: auto;
    min-width: 100px;
    max-width: 100%;
    padding: 0;
    letter-spacing: -0.04em;
    line-height: 1;
  }
  .amount-currency {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 36px;
    color: var(--text-2);
    letter-spacing: -0.02em;
  }
  .amount-available {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 18px;
  }
  .amount-quick {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    padding: 22px 22px 0;
  }
  .quick-btn {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 12px;
    color: var(--text-2);
    font-weight: 500;
  }

  /* ==== Method picker ==== */
  .method-list { padding: 0 22px; display: flex; flex-direction: column; gap: 6px; }
  .method {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 18px;
    padding: 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .method.selected {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .method-icon {
    width: 42px; height: 42px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    background: var(--surface-3);
    color: var(--text);
  }
  .method.selected .method-icon {
    background: var(--accent);
    color: #fff;
  }
  .method-info { flex: 1; min-width: 0; }
  .method-name {

const LoginScreen = ({ nav }) => {
  const [pin, setPin] = useState('');
  const handleKey = (k) => {
    if (k === 'del') { setPin(p => p.slice(0, -1)); return; }
    if (k === 'bio') { nav('home'); return; }
    if (pin.length < 4) {
      const newPin = pin + k;
      setPin(newPin);
      if (newPin.length === 4) setTimeout(() => nav('home'), 250);
    }
  };
  return (
    <div className="screen">
      <TopBar onBack={() => nav('welcome')} />
      <div className="pin-screen">
        <div style={{ textAlign: 'center' }}>
          <div className="brand-mark" style={{ margin: '0 auto 20px', width: 48, height: 48, fontSize: 32 }}>w</div>

          <div className="pin-dots">
            {[0,1,2,3].map(i => <div key={i} className={`pin-dot ${pin.length > i ? 'filled' : ''}`} />)}

        </div>
        <div className="keypad">

// ============= APP =============
function App() {
  const [route, setRoute] = useState('welcome');
  const [params, setParams] = useState(null);
  const [mainTab, setMainTab] = useState('home');
  const [theme, setTheme] = useState('dark');

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('theme-meta')?.setAttribute('content', theme === 'dark' ? '#0d0d10' : '#f5f1ea');
  }, [theme]);

  const onThemeToggle = () => setTheme(t => t === 'dark' ? 'light' : 'dark');

  const nav = (r, p = null) => {
    if (['home', 'history', 'market', 'profile'].includes(r)) {
      setMainTab(r);
    }
    setRoute(r);
    setParams(p);
  };

  const themeProps = { theme, onThemeToggle };

  const screens = {
    welcome: <WelcomeScreen nav={nav} {...themeProps} />,
    register: <RegisterScreen nav={nav} />,
    kyc: <KycScreen nav={nav} />,
    openAccount: <OpenAccountScreen nav={nav} />,
    login: <LoginScreen nav={nav} />,
    home: <HomeScreen nav={nav} setMainTab={setMainTab} />,
    notifications: <NotificationsScreen nav={nav} />,
    txDetail: <TxDetailScreen nav={nav} params={params} />,
    payout: <PayoutScreen nav={nav} />,
    payoutSuccess: <PayoutSuccessScreen nav={nav} params={params} />,
    qr: <QrScreen nav={nav} />,
    qrConfirm: <QrConfirmScreen nav={nav} />,
    qrSuccess: <QrSuccessScreen nav={nav} />,
    convert: <ConvertScreen nav={nav} />,
    convertSuccess: <ConvertSuccessScreen nav={nav} />,
    cardManage: <CardManageScreen nav={nav} />,
    history: <HistoryScreen nav={nav} />,
    market: <MarketScreen nav={nav} />,
    marketDetail: <MarketDetailScreen nav={nav} params={params} />,
    marketSuccess: <MarketSuccessScreen nav={nav} params={params} />,
    profile: <ProfileScreen nav={nav} {...themeProps} />,
    customize: <CustomizeScreen nav={nav} />,
    security: <SecurityScreen nav={nav} />,
  };

  const showBottomNav = ['home', 'history', 'market', 'profile'].includes(route);

  return (
    <div className="phone">
      {screens[route]}
      {showBottomNav && <BottomNav active={mainTab} nav={(r) => { setMainTab(r); setRoute(r); }} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
