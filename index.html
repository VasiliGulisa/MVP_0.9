<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallet · Прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --bg-page: #0e0d14;
    --bg-app: #1c1b24;
    --bg-card: #232230;
    --bg-card-hover: #2a293a;
    --bg-tertiary: #2e2d3a;
    --border: #2e2d3a;
    --border-light: #3a3948;
    --text-primary: #f0eef8;
    --text-secondary: #b0aec8;
    --text-tertiary: #7a7a8a;
    --text-muted: #55546a;

    --accent-pink: #f4a0b5;
    --accent-pink-bg: #3a2535;
    --accent-pink-border: #c2607a;
    --accent-mint: #7ecfaa;
    --accent-mint-bg: #1e3028;
    --accent-amber: #f5cf80;
    --accent-amber-bg: #2a2820;
    --accent-purple: #c49eff;
    --accent-purple-bg: #2e2038;
    --accent-blue: #a09eff;
    --accent-blue-bg: #1e2030;
    --accent-cyan: #7fc5e0;
    --accent-cyan-bg: #1e2a30;

    --font-display: 'Fraunces', serif;
    --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-body);
    background: var(--bg-app);
    color: var(--text-primary);
    overflow: hidden;
    font-feature-settings: "ss01", "cv11";
  }
  #root { height: 100vh; width: 100vw; display: flex; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, select { font-family: inherit; }
  .phone {
    width: 100%;
    height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    background: var(--bg-app);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .screen {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateX(8px); } to { opacity: 1; transform: translateX(0); } }
  .screen::-webkit-scrollbar { width: 0; }
  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 24px 4px;
    font-size: 12px;
    color: var(--text-tertiary);
    flex-shrink: 0;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px 8px;
    flex-shrink: 0;
  }
  .topbar-title {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 18px;
    color: var(--text-primary);
    letter-spacing: -0.01em;
  }
  .icon-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 0.5px solid var(--border-light);
    display: flex; align-items: center; justify-content: center;
    background: transparent;
  }
  .back-btn { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-tertiary); }

  /* Onboarding */
  .onb-bg {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 30% 20%, #3a2535 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, #1e2030 0%, transparent 50%),
                var(--bg-app);
  }
  .onb-content {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 60px 28px 40px;
  }
  .logo-mark {
    width: 60px; height: 60px;
    border-radius: 18px;
    background: linear-gradient(135deg, #f4a0b5, #c2607a);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 28px;
    color: #0e0d14;
    box-shadow: 0 8px 30px rgba(244, 160, 181, 0.25);
  }
  .onb-title {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 38px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin: 24px 0 12px;
  }
  .onb-title em {
    font-style: italic;
    color: var(--accent-pink);
  }
  .onb-sub {
    font-size: 15px;
    color: var(--text-secondary);
    line-height: 1.5;
    max-width: 280px;
  }
  .onb-features {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 28px;
  }
  .onb-feature {
    display: flex; align-items: center; gap: 12px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .onb-feature-dot {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--accent-pink-bg);
    border: 1px solid var(--accent-pink-border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent-pink), #d97a96);
    color: #0e0d14;
    font-weight: 600;
    font-size: 15px;
    padding: 16px 24px;
    border-radius: 16px;
    width: 100%;
    transition: transform 0.15s;
  }
  .btn-primary:active { transform: scale(0.98); }
  .btn-secondary {
    background: var(--bg-card);
    color: var(--text-primary);
    border: 0.5px solid var(--border-light);
    font-weight: 500;
    font-size: 14px;
    padding: 14px 20px;
    border-radius: 14px;
    width: 100%;
  }
  .btn-link {
    color: var(--text-tertiary);
    font-size: 13px;
    padding: 10px;
    text-align: center;
    width: 100%;
  }

  /* Home */
  .greet { font-size: 12px; color: var(--text-tertiary); }
  .greet-name { font-size: 14px; font-weight: 500; color: var(--text-primary); }
  .avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--accent-pink-bg);
    border: 1.5px solid var(--accent-pink-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 500;
    color: var(--accent-pink);
  }
  .cards-viewport { padding: 8px 0 6px; }
  .cards-track {
    display: flex; gap: 12px;
    padding: 0 20px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  .cards-track::-webkit-scrollbar { display: none; }
  .acc-card {
    min-width: calc(380px - 40px);
    border-radius: 22px;
    padding: 22px;
    flex-shrink: 0;
    scroll-snap-align: center;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }
  .acc-card::before {
    content: '';
    position: absolute;
    top: -30px; right: -30px;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
  }
  .acc-tag {
    font-size: 10px; font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.65;
    margin-bottom: 14px;
  }
  .acc-balance {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 32px;
    letter-spacing: -1px;
    line-height: 1;
    margin-bottom: 6px;
    color: #fff;
  }
  .acc-equiv {
    font-size: 12px;
    opacity: 0.7;
    margin-bottom: 18px;
  }
  .acc-foot {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px;
  }
  .dots-nav {
    display: flex; justify-content: center; gap: 5px;
    padding: 8px 0 4px;
  }
  .dot-nav {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--border-light);
    transition: all 0.2s;
  }
  .dot-nav.active { background: var(--accent-pink); width: 16px; border-radius: 3px; }

  .total-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 22px 18px;
  }
  .total-label { font-size: 12px; color: var(--text-tertiary); }
  .total-val { font-size: 13px; font-weight: 500; color: var(--text-secondary); }

  .actions-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 8px;
    padding: 0 20px 20px;
  }
  .action-btn {
    background: var(--bg-card);
    border: 0.5px solid var(--border);
    border-radius: 14px;
    padding: 13px 6px;
    display: flex; flex-direction: column; align-items: center;
    gap: 7px;
  }
  .action-btn:active { background: var(--bg-card-hover); }
  .action-icon {
    width: 36px; height: 36px;
    border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
  }
  .action-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-secondary);
  }

  .section-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 22px 10px;
  }
  .section-title {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 15px;
    color: var(--text-primary);
    letter-spacing: -0.01em;
  }
  .section-link {
    font-size: 12px;
    color: var(--accent-pink);
  }

  .tx-list { padding: 0 12px 80px; }
  .tx-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px;
    border-radius: 12px;
    cursor: pointer;
  }
  .tx-item:active { background: var(--bg-card); }
  .tx-icon {
    width: 40px; height: 40px;
    border-radius: 13px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .tx-info { flex: 1; min-width: 0; }
  .tx-name {
    font-size: 13px; font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tx-date {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .tx-amount {
    font-size: 14px; font-weight: 500;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .tx-amount.in { color: var(--accent-mint); }
  .tx-amount.out { color: var(--accent-pink); }

  /* Bottom nav */
  .bottomnav {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-top: 0.5px solid var(--border);
    padding: 10px 0 18px;
    background: var(--bg-app);
    flex-shrink: 0;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center;
    gap: 4px;
    cursor: pointer;
    padding: 6px;
  }
  .nav-label { font-size: 10px; color: var(--text-muted); }
  .nav-item.active .nav-label { color: var(--accent-pink); }
  .nav-dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--accent-pink);
    margin-top: 2px;
  }

  /* Form */
  .form-group {
    padding: 0 22px 14px;
  }
  .form-label {
    font-size: 11px;
    color: var(--text-tertiary);
    margin-bottom: 6px;
    letter-spacing: 0.03em;
  }
  .form-input {
    width: 100%;
    background: var(--bg-card);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  .form-input:focus { border-color: var(--accent-pink-border); }
  .form-input::placeholder { color: var(--text-muted); }
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  /* List rows */
  .list-section { padding: 0 14px 8px; }
  .list-section-label {
    font-size: 10px;
    color: var(--text-tertiary);
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 16px 8px 8px;
  }
  .list-card {
    background: var(--bg-card);
    border-radius: 14px;
    border: 0.5px solid var(--border);
    overflow: hidden;
  }
  .list-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    cursor: pointer;
  }
  .list-row + .list-row { border-top: 0.5px solid var(--border); }
  .list-row:active { background: var(--bg-card-hover); }
  .list-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .list-content { flex: 1; min-width: 0; }
  .list-title {
    font-size: 13px; font-weight: 500;
    color: var(--text-primary);
  }
  .list-sub {
    font-size: 11px;
    color: var(--text-tertiary);
    margin-top: 2px;
  }
  .list-arrow {
    color: var(--text-muted);
  }

  /* Receipt / detail */
  .detail-hero {
    text-align: center;
    padding: 24px 22px 30px;
  }
  .detail-amount {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 44px;
    letter-spacing: -1.5px;
    line-height: 1;
    margin: 12px 0 8px;
  }
  .detail-label {
    font-size: 13px;
    color: var(--text-tertiary);
    margin-top: 4px;
  }
  .detail-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-mint-bg);
    color: var(--accent-mint);
    border: 0.5px solid var(--accent-mint);
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    margin-top: 10px;
  }
  .detail-rows {
    margin: 0 18px 16px;
    background: var(--bg-card);
    border-radius: 14px;
    border: 0.5px solid var(--border);
    overflow: hidden;
  }
  .detail-row {
    display: flex; justify-content: space-between;
    padding: 13px 16px;
    font-size: 13px;
  }
  .detail-row + .detail-row { border-top: 0.5px solid var(--border); }
  .detail-row-label { color: var(--text-tertiary); }
  .detail-row-val { color: var(--text-primary); font-weight: 500; }
  .detail-row-val.mint { color: var(--accent-mint); }

  /* Bottom button row */
  .bottom-actions {
    padding: 14px 22px 22px;
    border-top: 0.5px solid var(--border);
    background: var(--bg-app);
    flex-shrink: 0;
  }
  .bottom-actions-inline { display: flex; gap: 10px; }

  /* Pin code */
  .pin-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 60px 30px 40px;
  }
  .pin-dots {
    display: flex;
    gap: 16px;
    margin: 24px 0;
  }
  .pin-dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 1.5px solid var(--text-tertiary);
    transition: all 0.15s;
  }
  .pin-dot.filled {
    background: var(--accent-pink);
    border-color: var(--accent-pink);
  }
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    width: 100%;
    max-width: 280px;
  }
  .key {
    aspect-ratio: 1.7;
    border-radius: 18px;
    background: var(--bg-card);
    border: 0.5px solid var(--border);
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 400;
    color: var(--text-primary);
    transition: background 0.1s;
  }
  .key:active { background: var(--bg-card-hover); }
  .key.special { background: transparent; border: none; color: var(--text-tertiary); font-size: 13px; }

  /* QR */
  .qr-viewport {
    flex: 1;
    background: #000;
    position: relative;
    overflow: hidden;
  }
  .qr-frame {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 240px; height: 240px;
    border-radius: 24px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.6);
  }
  .qr-corner {
    position: absolute;
    width: 30px; height: 30px;
    border: 3px solid var(--accent-pink);
  }
  .qr-corner.tl { top: 0; left: 0; border-right: none; border-bottom: none; border-radius: 12px 0 0 0; }
  .qr-corner.tr { top: 0; right: 0; border-left: none; border-bottom: none; border-radius: 0 12px 0 0; }
  .qr-corner.bl { bottom: 0; left: 0; border-right: none; border-top: none; border-radius: 0 0 0 12px; }
  .qr-corner.br { bottom: 0; right: 0; border-left: none; border-top: none; border-radius: 0 0 12px 0; }
  .qr-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 22px;
    background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
  }
  .qr-hint {
    font-size: 13px;
    color: rgba(255,255,255,0.85);
    text-align: center;
    margin-bottom: 14px;
  }

  /* Toggle */
  .toggle {
    width: 42px; height: 24px;
    border-radius: 12px;
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .toggle.on { background: var(--accent-pink-border); }
  .toggle.off { background: var(--border-light); }
  .toggle-thumb {
    position: absolute;
    top: 3px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #fff;
    transition: left 0.2s;
  }
  .toggle.on .toggle-thumb { left: 21px; }
  .toggle.off .toggle-thumb { left: 3px; }

  /* Method picker */
  .method-card {
    background: var(--bg-card);
    border: 0.5px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .method-card.selected {
    border-color: var(--accent-pink-border);
    background: var(--accent-pink-bg);
  }
  .method-icon {
    width: 40px; height: 40px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .method-info { flex: 1; }
  .method-name { font-size: 13px; font-weight: 500; color: var(--text-primary); }
  .method-meta { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
  .method-radio {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 1.5px solid var(--text-tertiary);
    flex-shrink: 0;
    position: relative;
  }
  .method-radio.selected { border-color: var(--accent-pink); }
  .method-radio.selected::after {
    content: '';
    position: absolute;
    top: 3px; left: 3px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent-pink);
  }

  /* Big amount input */
  .amount-input-wrap {
    text-align: center;
    padding: 36px 22px 24px;
  }
  .amount-input {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 56px;
    letter-spacing: -2px;
    background: transparent;
    border: none;
    color: var(--text-primary);
    text-align: center;
    width: 100%;
    outline: none;
  }
  .amount-currency {
    font-size: 14px;
    color: var(--text-tertiary);
    margin-bottom: 8px;
  }
  .amount-available {
    font-size: 12px;
    color: var(--text-tertiary);
    margin-top: 16px;
  }
  .amount-quick {
    display: flex;
    gap: 8px;
    padding: 14px 22px 0;
    justify-content: center;
  }
  .quick-btn {
    background: var(--bg-card);
    border: 0.5px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .quick-btn:active { background: var(--bg-card-hover); }

  /* Success */
  .success-screen {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 30px;
    text-align: center;
  }
  .success-icon {
    width: 88px; height: 88px;
    border-radius: 50%;
    background: var(--accent-mint-bg);
    border: 1.5px solid var(--accent-mint);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 24px;
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .success-title {
    font-family: var(--font-display);
    font-size: 28px;
    margin-bottom: 8px;
  }
  .success-sub {
    color: var(--text-secondary);
    font-size: 14px;
    line-height: 1.5;
    max-width: 280px;
  }

  /* Spark */
  .spark-card {
    margin: 0 22px 18px;
    padding: 14px 16px 10px;
    background: var(--bg-card);
    border-radius: 14px;
    border: 0.5px solid var(--border);
  }
  .spark-head { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .spark-label { font-size: 11px; color: var(--text-tertiary); letter-spacing: 0.04em; text-transform: uppercase; }

// Login
const LoginScreen = ({ nav }) => {
  const [pin, setPin] = useState('');
  const handleKey = (k) => {
    if (k === 'del') { setPin(p => p.slice(0, -1)); return; }
    if (k === 'bio') { nav('home'); return; }
    if (pin.length < 4) {
      const newPin = pin + k;
      setPin(newPin);
      if (newPin.length === 4) setTimeout(() => nav('home'), 300);
    }
  };
  return (
    <div className="screen">
      <StatusBar />
      <TopBar leftElement={<button className="btn-link" style={{ width: 'auto', padding: 0 }} onClick={() => nav('welcome')}>Назад</button>} />

          <p style={{ fontSize: 13, color: 'var(--text-tertiary)', marginTop: 8 }}>Введи PIN-код</p>
          <div className="pin-dots">
            {[0,1,2,3].map(i => <div key={i} className={`pin-dot ${pin.length > i ? 'filled' : ''}`} />)}
          </div>
        </div>
        <div className="keypad">
          {['1','2','3','4','5','6','7','8','9','bio','0','del'].map(k => (
            <button key={k} className={`key ${k === 'bio' || k === 'del' ? 'special' : ''}`} onClick={() => handleKey(k)}>

// Customize
const CustomizeScreen = ({ nav }) => {

  const Toggle = ({ value, onChange }) => (
    <div className={`toggle ${value ? 'on' : 'off'}`} onClick={onChange}><div className="toggle-thumb" /></div>

  return (
    <div className="screen">
      <StatusBar />

        <div className="list-section">

            {Object.entries({ usd: ['USD счёт', '$4,820.50'], eur: ['EUR счёт', '€2,150.00'], usdt: ['USDT счёт', '1,200 USDT'], cop: ['COP счёт', '$1.24M COP'] }).map(([k, [name, val]]) => (
              <div key={k} className="cust-row">
                <div className="drag-grip"><div className="drag-line"/><div className="drag-line"/><div className="drag-line"/></div>
                <div className="list-content"><div className="list-title">{name}</div><div className="list-sub">{val}</div></div>
                <Toggle value={accs[k]} onChange={() => setAccs({...accs, [k]: !accs[k]})} />

// ============= APP =============
function App() {
  const [route, setRoute] = useState('welcome');
  const [params, setParams] = useState(null);
  const [mainTab, setMainTab] = useState('home');

  const nav = (r, p = null) => {
    if (['home', 'history', 'market', 'profile'].includes(r)) {
      setMainTab(r);
      setRoute(r);
    } else {
      setRoute(r);
    }
    setParams(p);
    if (route === r) return;
  };

  const screens = {
    welcome: <WelcomeScreen nav={nav} />,
    register: <RegisterScreen nav={nav} />,
    kyc: <KycScreen nav={nav} />,
    openAccount: <OpenAccountScreen nav={nav} />,
    login: <LoginScreen nav={nav} />,
    home: <HomeScreen nav={nav} setMainTab={setMainTab} />,
    notifications: <NotificationsScreen nav={nav} />,
    txDetail: <TxDetailScreen nav={nav} params={params} />,
    payout: <PayoutScreen nav={nav} />,
    payoutSuccess: <PayoutSuccessScreen nav={nav} params={params} />,
    qr: <QrScreen nav={nav} />,
    qrConfirm: <QrConfirmScreen nav={nav} />,
    qrSuccess: <QrSuccessScreen nav={nav} />,
    convert: <ConvertScreen nav={nav} />,
    convertSuccess: <ConvertSuccessScreen nav={nav} />,
    cardManage: <CardManageScreen nav={nav} />,
    history: <HistoryScreen nav={nav} />,
    market: <MarketScreen nav={nav} />,
    marketDetail: <MarketDetailScreen nav={nav} params={params} />,
    marketSuccess: <MarketSuccessScreen nav={nav} params={params} />,
    profile: <ProfileScreen nav={nav} />,
    customize: <CustomizeScreen nav={nav} />,
    security: <SecurityScreen nav={nav} />,
  };

  const showBottomNav = ['home', 'history', 'market', 'profile'].includes(route);

  return (
    <div className="phone">
      {screens[route]}
      {showBottomNav && <BottomNav active={mainTab} nav={(r) => { setMainTab(r); setRoute(r); }} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
